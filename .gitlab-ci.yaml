stages:
- build
- deploy

variables:
  WEBSERVER: httpd
  PROJECT_IMAGE: ${CI_REGISTRY_IMAGE}:${WEBSERVER}


Construction Image:

  image: docker:latest
  services:
  - docker:latest
  stage: build
  script:
  #construction
  - docker image build -t ${PROJECT_IMAGE} -f  Dockerfile.${WEBSERVER} ${PWD}
  #Login registry
  - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
  # Push image
  - docker image push ${PROJECT_IMAGE}
  # Clean local image repo
  - docker image rm ${PROJECT_IMAGE}

Deploiement:
  stage: deploy
  tags:
  - deploiement

  script:
  - docker login -u ${CI_DEPLOY_USER} -p ${CI_DEPLOY_PASSWORD} ${CI_REGISTRY}
  - docker compose -f compose.prod.yml up -d
  - docker logout ${CI_REGISTRY}
  - echo "Success my bro "


